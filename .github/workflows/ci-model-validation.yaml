name: CI Model Validation

on:
  pull_request:
    branches: [ci-checks, main-dev, main]
  push:
    branches: [ci-checks, main-dev, main]

jobs:
  synthetic-fhir-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run synthetic + FHIR validation target
        run: ./ci/run.sh synthetic-fhir-validation

  model-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run model validation target
        run: ./ci/run.sh model-validation
