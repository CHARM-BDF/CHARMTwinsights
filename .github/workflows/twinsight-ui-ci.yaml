name: Twinsight UI CI

on:
  push:
    branches: [main, main-dev, vandv]
    paths:
      - 'app/twinsight_ui/**'
      - '.github/workflows/twinsight-ui-ci.yaml'
  pull_request:
    branches: [main, main-dev, vandv]
    paths:
      - 'app/twinsight_ui/**'
      - '.github/workflows/twinsight-ui-ci.yaml'

jobs:
  ui-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/twinsight_ui

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm run test

      - name: Build
        run: npm run build
