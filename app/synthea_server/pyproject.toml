[tool.poetry]
name = "synthea-pyserver"
version = "0.1.0"
description = ""
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"

# Explicitly include the package
packages = [
    { include = "synthea-pyserver" }
]

[tool.poetry.dependencies]
python = ">=3.13,<4"
fastapi = ">=0.115.12,<0.116.0"
uvicorn = ">=0.34.2,<0.35.0"
pandas = "^2.2.3"
requests = "^2.32.4"
httpx = "^0.27.0"
torch = ">=2.0.0"
numpy = ">=1.24.0"
scikit-learn = ">=1.0.0"
tqdm = ">=4.0.0"
plotly = ">=5.0.0"
reportlab = "^4.4.10"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["synthea-pyserver/tests"]